name: Build and Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to upload to (internal, production, alpha, beta)'
        required: false
        default: 'internal'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Decode upload keystore (from SECRET: KEYSTORE_BASE64)
        run: |
          echo "Checking for KEYSTORE_BASE64 secret..."
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo ${{ secrets.KEYSTORE_BASE64 }} | base64 --decode > keystore.jks
            echo "Keystore written to ./keystore.jks"
          else
            echo "No KEYSTORE_BASE64 secret provided; building without custom signing."
          fi

      - name: Build release AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: app/build/outputs/bundle/release/*.aab

  publish-to-play:
    if: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode Play service account
        run: |
          echo "Writing Play service account JSON"
          echo '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' > /tmp/play_service_account.json

      - name: Upload to Google Play (selected track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: /tmp/play_service_account.json
          packageName: 'com.qrgenie.app'
          releaseFile: 'app/build/outputs/bundle/release/app-release.aab'
          track: ${{ github.event.inputs.track || 'internal' }}

      - name: Cleanup
        run: |
          rm -f /tmp/play_service_account.json || true
          rm -f keystore.jks || true

